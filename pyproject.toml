# pyproject.toml is the single modern config file for a Python project.
# It tells pip how to build and install the package, lists dependencies,
# and (in later steps) holds tool settings for ruff and pytest.

[build-system]
# setuptools is the standard, free build backend. pip uses it to turn the
# source in src/ into an installable package.
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notetaker"
version = "0.1.0"
description = "AI lecture note taker built on free, open models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Akshara Gopakumar" }]

# Runtime dependencies are added step by step as features land, so the
# install stays small and every listed package is actually used.
dependencies = [
    # Typed settings loaded from environment variables and .env (config.py).
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# "Extras" are optional groups of packages. Install the dev tools with:
#   pip install -e ".[dev]"
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
# This creates a `notetaker` command on your PATH after install. It calls
# the main() function in src/notetaker/cli.py.
notetaker = "notetaker.cli:main"

[tool.setuptools.packages.find]
# The "src layout": code lives in src/notetaker rather than at the repo root.
# This forces tests to import the *installed* package, which catches
# packaging mistakes (like a missing file) that a root layout would hide.
where = ["src"]

# ---------------------------------------------------------------------------
# Tool settings. Keeping them here (instead of separate ruff.toml / pytest.ini
# files) means one file describes the whole project.
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
# Where pytest looks for tests, so `pytest` works from the repo root.
testpaths = ["tests"]
# -ra: print a short summary of anything that did not pass (skips, xfails).
# --strict-markers: a typo in a @pytest.mark.<name> becomes an error
#   instead of silently creating a new, unused marker.
addopts = "-ra --strict-markers"
# Markers must be declared because of --strict-markers above. "slow" is for
# tests that load real models; CI will skip them with `-m "not slow"`.
markers = [
    "slow: loads real models or audio; skipped in CI",
]

[tool.ruff]
# ruff is one fast tool that replaces flake8 (lint), isort (import order)
# and black (formatting).
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Rule families ruff checks. Each letter code is a family of rules:
#   E, W = pycodestyle (basic style errors and warnings)
#   F    = pyflakes (real bugs: unused imports, undefined names)
#   I    = isort (imports sorted and grouped)
#   B    = bugbear (common bug patterns, e.g. mutable default arguments)
#   UP   = pyupgrade (use modern syntax for our minimum Python version)
#   SIM  = simplify (flags needlessly complicated code)
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
