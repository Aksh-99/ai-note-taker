# GitHub Actions CI: runs lint + tests on every push and pull request.
#
# How to read this file:
#   - A "workflow" is triggered by events (the `on:` block).
#   - It contains "jobs"; each job runs on a fresh virtual machine ("runner").
#   - A job is a list of "steps": either a reusable action (`uses:`) or a
#     shell command (`run:`).
#
# Rule for this project: CI must stay fast and free. It never calls a live
# LLM API and never downloads big models. Tests that need those are marked
# `@pytest.mark.slow` and skipped here (`make test` passes -m "not slow").

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Adds a "Run workflow" button in the Actions tab for manual runs.
  workflow_dispatch:

# If a newer commit lands on the same branch while CI is still running,
# cancel the old run. Saves free CI minutes and gives faster feedback.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the code, never write to the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A "matrix" runs the same job once per value. We test the oldest Python
    # we support (pyproject says >=3.10) and a recent one, so we catch both
    # "used a too-new feature" and "broke on the latest version" bugs.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      # 1. Download the repo's code onto the runner.
      - uses: actions/checkout@v4

      # 2. Install the requested Python version. `cache: pip` reuses
      #    downloaded packages between runs, keyed on pyproject.toml.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # 3. Make sure ffmpeg (used by audio.py) is available. GitHub's Ubuntu
      #    image usually ships it; install it only if it is missing.
      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      # 4. Install the package plus dev tools (pytest, ruff).
      - name: Install
        run: |
          python -m pip install --upgrade pip
          make install

      # 5. Lint and format check. Fails the build on any ruff complaint.
      - name: Lint
        run: make lint

      # 6. Run the fast test suite (slow tests are skipped).
      - name: Test
        run: make test
